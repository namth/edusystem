version: '3.8'

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3645:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORTKEY_API_KEY=${PORTKEY_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORTKEY_CONFIG_ID=${PORTKEY_CONFIG_ID}
      - PORTKEY_MODEL=${PORTKEY_MODEL}
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      # Media bài học (ảnh/mp3, vd 3 khoá Cambridge ở /media/ej/...) nằm ngoài thư mục code trên server.
      # Next.js chỉ phục vụ file có trong public/ lúc khởi động: thêm file thì restart nextjs.
      - ${MEDIA_HOST_DIR:-../edusystem-media}:/app/public/media:ro
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Bỏ map port ra host để tránh xung đột với Redis sẵn có trên Server.
    # Các container khác (nextjs, worker) vẫn kết nối bình thường qua mạng nội bộ Docker (redis:6379).
    # ports:
    #   - "127.0.0.1:6379:6379"
    restart: unless-stopped

  grading-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - APP_URL=http://nextjs:3000
      - WORKER_ID=1
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PORTKEY_API_KEY=${PORTKEY_API_KEY}
      - PORTKEY_CONFIG_ID=${PORTKEY_CONFIG_ID}
      - PORTKEY_MODEL=${PORTKEY_MODEL}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      - redis
      - nextjs
    restart: unless-stopped

