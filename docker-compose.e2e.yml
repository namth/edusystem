# DB + Redis riêng cho kiểm thử E2E (npm run e2e). Không dùng chung Supabase dev/production.
services:
  e2e-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: kitokit_e2e
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d kitokit_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
  e2e-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
