<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Văn phòng ảo</title>
<style>
  :root { --bg:#191b26; --panel:#232636; --line:#33374b; --text:#e9e7f1; --muted:#9a9db4; --test:#a99bff; --ask:#f2a541; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:12px; }
  #wrap { position:relative; }
  canvas { display:block; image-rendering:pixelated; border-radius:6px; box-shadow:0 12px 40px #0009; }
  #ov { position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .tag, .bub, .sign { position:absolute; left:0; top:0; white-space:nowrap; will-change:transform; }
  .tag { font-size:11px; font-weight:600; padding:0 6px; border-radius:8px; background:#000b; color:#fff; }
  .bub { max-width:240px; overflow:hidden; text-overflow:ellipsis; background:#fff; color:#1d1d24; padding:3px 8px; border-radius:8px; font-size:12px; box-shadow:0 2px 8px #0006; opacity:0; transition:opacity .25s; border:2px solid transparent; }
  .bub.on { opacity:1; }
  .bub.test { border-color:var(--test); background:#f3f0ff; }
  .bub.ask { border-color:var(--ask); background:#fff6e8; }
  .sign { font-size:11px; padding:2px 8px; border-radius:6px; background:#0d1520d9; color:#cfe3ff; border:1px solid #3d5a80; max-width:60%; overflow:hidden; text-overflow:ellipsis; }
  .sign i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; background:#e5484d; }
  .sign.on i { background:#3fd17a; box-shadow:0 0 6px #3fd17a; }
  aside { width:330px; flex:none; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header h1 { font-size:15px; margin:0; flex:1; }
  #conn { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  #conn i { width:8px; height:8px; border-radius:50%; background:#e5484d; display:inline-block; }
  #conn.ok i { background:#3fa66b; }
  section { padding:10px 14px; border-bottom:1px solid var(--line); }
  section h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 6px; font-weight:600; }
  .person { display:grid; grid-template-columns:10px auto 1fr; align-items:center; column-gap:8px; padding:3px 0; }
  .person b { font-weight:600; }
  .person span { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person small { grid-column:2 / 4; color:#7f9cc4; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person .testing { color:var(--test); }
  .person .asking, #log div.ask { color:var(--ask); }
  .dot { width:10px; height:10px; border-radius:3px; flex:none; }
  .task { display:flex; align-items:center; gap:6px; padding:3px 0; }
  .task code { font-size:11px; color:var(--muted); flex:none; }
  .task .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill { font-size:10px; padding:1px 6px; border-radius:6px; color:#111; flex:none; }
  .empty { color:var(--muted); font-style:italic; }
  #logbox { flex:1; overflow:auto; min-height:120px; }
  #log div { padding:2px 0; color:var(--muted); font-size:12px; }
  #log div b { color:var(--text); font-weight:600; }
  #log div.test { color:var(--test); }
  #log time { font-variant-numeric:tabular-nums; margin-right:6px; opacity:.7; }
  @media (max-width:820px) {
    body { flex-direction:column; height:auto; overflow:auto; }
    #stage { height:62vh; padding:16px; }
    aside { width:auto; border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="cv"></canvas><div id="ov"></div></div></div>
<aside>
  <header><h1>Văn phòng ảo</h1><div id="conn"><i></i><span>Đang kết nối…</span></div></header>
  <section><h2>Nhân sự</h2><div id="people"></div></section>
  <section><h2>Bảng công việc</h2><div id="tasks"></div></section>
  <section id="logbox"><h2>Nhật ký</h2><div id="log"></div></section>
</aside>
<script>
'use strict';
// ---------- Bố cục (đơn vị: pixel logic của canvas 384×272) ----------
// Khu chung (y < 198) và phòng giám đốc (x > 272) đi qua lối giữa y = 112;
// khu máy từ xa (y > 206) đi qua lối dưới y = 262, nối với khu chung bằng cửa ở x = 124.
const W = 384, H = 272, SPEED = 64;
const AISLE = { main: 112, annex: 262 }, DOOR_X = 124, ANNEX_TOP = 206;
const zoneOf = (p) => (p.y > ANNEX_TOP - 3 ? 'annex' : 'main');
const COFFEE = { x: 24, y: 70 };
const CABLE = { x1: 28, x2: 150, y: 240 };
const P = {
  giamdoc:     { name: 'Anh Nam', role: 'Giám đốc', shirt: '#2f3550', pants: '#1c1e29', hair: '#8d8d8d', skin: '#f1c7a0', tie: '#c0392b',
                 desk: { x: 310, y: 128, w: 48 }, seat: { x: 334, y: 154 }, door: { x: 334, y: 154 }, visit: { x: 302, y: 152 }, lamp: true },
  truongphong: { name: 'Claude', role: 'Trưởng phòng', shirt: '#d97757', pants: '#3b3a48', hair: '#6b4226', skin: '#f3cfa8', glasses: true,
                 desk: { x: 190, y: 56, w: 40 }, seat: { x: 210, y: 82 }, door: { x: 210, y: 82 }, visit: { x: 240, y: 84 } },
  agy1:        { name: 'INOVA Antigravity', role: 'Nhân viên', shirt: '#3fa66b', pants: '#2c3e50', hair: '#1f1f1f', skin: '#e8b88f', hood: true,
                 desk: { x: 30, y: 140, w: 40 }, seat: { x: 50, y: 166 }, door: { x: 76, y: 166 }, visit: { x: 80, y: 166 } },
  agy2:        { name: 'Nam Antigravity', role: 'Nhân viên từ xa', shirt: '#4a7fd4', pants: '#34344a', hair: '#b5651d', skin: '#f6d3b3', remote: true,
                 desk: { x: 150, y: 222, w: 40 }, seat: { x: 170, y: 248 }, door: { x: 196, y: 248 }, visit: { x: 200, y: 248 } },
};
const ORDER = ['giamdoc', 'truongphong', 'agy1', 'agy2'];
const STATUS = ['todo', 'doing', 'review', 'done'];
const STATUS_UI = { todo: ['Chờ nhận', '#9aa0b5'], doing: ['Đang làm', '#f2a541'], review: ['Chờ duyệt', '#a99bff'], done: ['Xong', '#5cc98a'] };
const ONLINE_MS = 45000;

const shade = (hex, k) => '#' + hex.slice(1).match(/../g).map((h) => Math.max(0, Math.min(255, Math.round(parseInt(h, 16) * k))).toString(16).padStart(2, '0')).join('');
ORDER.forEach((id, i) => { P[id].dark = shade(P[id].shirt, 0.75); P[id].seed = i * 5; });

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const R = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };

// ---------- Trạng thái ----------
let C, tasks, logItems, packets = [], presence = {}, replayNow = null;
const now = () => replayNow ?? Date.now();

function reset() {
  C = {};
  for (const id of ORDER) {
    const p = P[id];
    C[id] = { id, p, x: p.seat.x, y: p.seat.y, atSeat: true, walking: false, facing: 'back', state: 'idle', carry: null,
              icon: '', iconUntil: 0, q: [], cur: null, bubble: null, idleSince: now(), lastWork: 0, coffeeDone: false,
              pendingWork: null, testing: null, meeting: false, interviewAt: 0, task: null, present: !p.remote };
  }
  tasks = {};
  logItems = [];
  packets = [];
}

// Nhân sự máy từ xa có mặt khi máy đó còn báo về trong 45 giây gần nhất.
function updatePresence() {
  for (const id of ORDER) {
    if (!P[id].remote) continue;
    const info = presence[id], c = C[id];
    const online = !!info && Date.now() - info.seenAt < ONLINE_MS;
    if (online !== c.present) { c.present = online; dirty.people = dirty.sign = true; }
  }
}

// ---------- Hàng đợi hành động của từng người ----------
const enq = (c, acts) => c.q.push(...acts);

function setState(c, s) {
  c.state = s;
  if (s === 'idle') c.idleSince = now();
  if (s === 'work' || s === 'testing') { c.lastWork = now(); c.coffeeDone = false; }
}
const setBubble = (c, text, ms, kind = '') => { if (text) c.bubble = { text, kind, until: Date.now() + ms }; };
const setIcon = (c, icon, ms = 0) => { c.icon = icon; c.iconUntil = ms ? Date.now() + ms : 0; };

function spotOf(c, dest) {
  if (dest === 'seat') return [c.p.door, c.p.seat];
  if (dest === 'coffee') return [COFFEE, COFFEE];
  return [P[dest].visit, P[dest].visit];
}

// Ra khỏi chỗ ngồi → lối đi của khu mình → (qua cửa nếu đổi khu) → lối đi khu đích → điểm vào → đích.
function routeTo(c, dest) {
  if (dest === 'seat' && c.atSeat) return [];
  const [entry, end] = spotOf(c, dest);
  const from = c.atSeat ? c.p.door : { x: c.x, y: c.y };
  const z1 = zoneOf(from), z2 = zoneOf(entry);
  const pts = [from, { x: from.x, y: AISLE[z1] }];
  if (z1 !== z2) pts.push({ x: DOOR_X, y: AISLE[z1] }, { x: DOOR_X, y: AISLE[z2] });
  pts.push({ x: entry.x, y: AISLE[z2] }, entry, end);
  const out = [];
  let px = c.x, py = c.y;
  for (const q of pts) if (q.x !== px || q.y !== py) { out.push({ x: q.x, y: q.y }); px = q.x; py = q.y; }
  return out;
}

function apply(c, a, live) {
  if (a.k === 'say') { if (live) setBubble(a.who ? C[a.who] : c, a.text, a.ms, a.kind); }
  else if (a.k === 'set') {
    if ('state' in a) setState(c, a.state);
    if ('carry' in a) c.carry = a.carry;
    if ('icon' in a) setIcon(c, a.icon);
    if ('facing' in a) c.facing = a.facing;
  } else if (a.k === 'fn') a.f(live);
  else if (a.k === 'go') {
    const end = spotOf(c, a.to)[1];
    c.x = end.x; c.y = end.y; c.atSeat = a.to === 'seat'; c.walking = false;
  }
}

function step(c, dt) {
  if (c.iconUntil && Date.now() > c.iconUntil) setIcon(c, '');
  if (!c.cur) {
    if (!c.q.length) {
      if (c.pendingWork) { const e = c.pendingWork; c.pendingWork = null; doWork(c, e, true); }
      return idleLogic(c);
    }
    c.cur = c.q.shift();
    c.cur.t = 0;
    if (c.cur.k === 'go') { c.cur.pts = routeTo(c, c.cur.to); if (c.cur.pts.length) c.atSeat = false; }
  }
  const a = c.cur;
  if (a.k === 'go') {
    let move = SPEED * dt;
    while (move > 0 && a.pts.length) {
      const t = a.pts[0], dx = t.x - c.x, dy = t.y - c.y, d = Math.hypot(dx, dy);
      c.facing = dy < -0.01 ? 'back' : 'front';
      if (d <= move) { c.x = t.x; c.y = t.y; move -= d; a.pts.shift(); }
      else { c.x += (dx / d) * move; c.y += (dy / d) * move; move = 0; }
    }
    c.walking = a.pts.length > 0;
    if (!c.walking) { c.atSeat = a.to === 'seat'; c.facing = c.atSeat ? 'back' : 'front'; c.cur = null; }
  } else if (a.k === 'wait') {
    a.t += dt * 1000;
    if (a.t >= a.ms) c.cur = null;
  } else {
    apply(c, a, true);
    c.cur = null;
  }
}

// Chạy hết hàng đợi ngay lập tức (khi dựng lại từ lịch sử hoặc khi tab quay lại).
function flush(c) {
  let guard = 0;
  while ((c.cur || c.q.length) && guard++ < 1000) {
    const a = c.cur || c.q.shift();
    c.cur = null;
    if (a.k !== 'wait') apply(c, a, false);
  }
  c.walking = false;
  if (c.pendingWork) { const e = c.pendingWork; c.pendingWork = null; doWork(c, e, false); flush(c); }
  if (c.testing) { const v = P[c.testing.owner].visit; c.x = v.x; c.y = v.y; c.atSeat = false; c.facing = 'back'; return; }
  if (c.meeting) { const v = P.giamdoc.visit; c.x = v.x; c.y = v.y; c.atSeat = false; c.facing = 'front'; return; }
  if (!c.atSeat) apply(c, { k: 'go', to: 'seat' }, false);
  c.facing = 'back';
}

function idleLogic(c) {
  if (c.id === 'giamdoc' || !c.present) return;
  const t = now();
  if (c.testing && t - c.lastWork > 120000) endTesting(c); // không thấy kết luận nghiệm thu thì tự về bàn
  // Nhân sự còn task đang làm (đã nhận, chưa nộp) thì vẫn là đang làm dù lâu không sửa file (đang nghĩ, chạy test…).
  const busyTask = c.id.startsWith('agy') && tasks[c.task]?.status === 'doing';
  if (c.state === 'work' && t - c.lastWork > 90000 && !busyTask) setState(c, 'idle');
  if (c.state === 'idle' && c.atSeat && !c.icon && !c.coffeeDone && t - c.idleSince > 25000 && !c.p.remote) {
    c.coffeeDone = true;
    enq(c, [
      { k: 'say', text: '☕ Đi pha cà phê', ms: 2000, coffee: true },
      { k: 'go', to: 'coffee', coffee: true },
      { k: 'set', state: 'coffee', carry: 'cup', coffee: true },
      { k: 'wait', ms: 7000, coffee: true },
      { k: 'go', to: 'seat', coffee: true },
      { k: 'set', state: 'idle', carry: null, coffee: true },
    ]);
  }
}

// Có việc mới thì bỏ dở chuyến cà phê, quay về bàn.
function interrupt(c) {
  if (!c || !(c.cur?.coffee || c.q.some((a) => a.coffee))) return;
  if (c.cur?.coffee) c.cur = null;
  c.q = c.q.filter((a) => !a.coffee);
  c.q.unshift({ k: 'go', to: 'seat' }, { k: 'set', state: 'idle', carry: null });
}

function doWork(c, e, live) {
  if (!c.atSeat) { enq(c, [{ k: 'go', to: 'seat' }]); c.pendingWork = e; return; }
  setState(c, 'work');
  if (c.icon !== '🙋') setIcon(c, '');
  if (live) setBubble(c, (c.id.startsWith('agy') ? '⌨️ ' : '') + (e.text || 'Đang làm'), 3500);
}

// ---------- Hỏi / phỏng vấn giám đốc: trưởng phòng cầm sổ vào phòng, đứng hỏi và chờ trả lời ----------
const INTERVIEW_MS = 30 * 60 * 1000;
const LIGHT_WORK = /^(Đọc|Tìm|Tra cứu|Dùng skill|Xem trình duyệt|Gọi trợ lý)/; // việc làm được ngay trong phòng
const interviewing = (c) => c.interviewAt && now() - c.interviewAt < INTERVIEW_MS;

function goAsk(c, text) {
  if (c.testing) { const o = C[c.testing.owner]; if (o?.icon === '🔍') setIcon(o, ''); c.testing = null; }
  c.pendingWork = null;
  setIcon(C.giamdoc, '💬');
  if (c.meeting) { enq(c, [{ k: 'set', state: 'asking' }, { k: 'say', text, ms: 6000, kind: 'ask' }]); return; }
  c.meeting = true;
  enq(c, [
    { k: 'set', carry: 'notebook' },
    { k: 'go', to: 'giamdoc' },
    { k: 'set', state: 'asking', facing: 'front' },
    { k: 'say', text, ms: 6000, kind: 'ask' },
  ]);
}

function leaveMeeting(c) {
  if (!c.meeting) return;
  c.meeting = false;
  setIcon(C.giamdoc, '');
  enq(c, [{ k: 'set', carry: null, state: 'idle' }, { k: 'go', to: 'seat' }]);
}

function endTesting(c) {
  const o = c.testing && C[c.testing.owner];
  c.testing = null;
  if (o && o.icon === '🔍') setIcon(o, '');
  enq(c, [{ k: 'set', carry: null, state: 'idle' }, { k: 'go', to: 'seat' }]);
}

// ---------- Sự kiện → hoạt cảnh ----------
function onEvent(e, live) {
  addLog(e);
  updateTask(e);
  const c = C[e.who], to = C[e.to];
  if (e.task && e.who.startsWith('agy')) c.task = e.task;
  if (live && (P[e.who].remote || P[e.to]?.remote)) {
    packets.push({ t0: Date.now(), up: P[e.who].remote });
    const r = P[e.who].remote ? e.who : e.to;
    if (presence[r]) presence[r].seenAt = Date.now();
  }
  interrupt(c);
  interrupt(to);
  const T = e.task || '';
  switch (e.type) {
    case 'interview':
      c.interviewAt = now();
      goAsk(c, '🎤 ' + (e.text || 'Phỏng vấn giám đốc'));
      break;
    case 'ask':
      if (interviewing(c)) c.interviewAt = now();
      goAsk(c, '❓ ' + (e.text || 'Xin ý kiến giám đốc'));
      break;
    case 'answer':
      setIcon(c, '');
      if (!to) break;
      if (interviewing(to)) to.interviewAt = now();
      enq(to, [{ k: 'say', who: 'giamdoc', text: '💬 ' + (e.text || 'Đã trả lời'), ms: 4500 }, { k: 'say', text: '📝 Em ghi lại ạ', ms: 2000, kind: 'ask' }]);
      break;
    case 'assign':
      if (!to || to === c) break;
      if (c.id === 'giamdoc' && (to.meeting || interviewing(to))) { // đang phỏng vấn: lời nhắn của giám đốc là câu trả lời
        if (interviewing(to)) to.interviewAt = now();
        if (!to.meeting) goAsk(to, '👂 Em nghe ạ');
        setIcon(c, '');
        enq(to, [{ k: 'say', who: 'giamdoc', text: '💬 ' + (e.text || '…'), ms: 4500 }, { k: 'set', state: 'asking' }]);
        break;
      }
      if (c.id === 'giamdoc') {
        setIcon(c, '');
        to.testing = null;
        enq(to, [
          { k: 'set', carry: null },
          { k: 'go', to: 'giamdoc' },
          { k: 'say', who: 'giamdoc', text: '📋 ' + (e.text || 'Việc mới'), ms: 4000 },
          { k: 'wait', ms: 1600 },
          { k: 'set', carry: 'folder' },
          { k: 'say', text: 'Rõ, sếp!', ms: 1500 },
          { k: 'go', to: 'seat' },
          { k: 'set', carry: null, state: 'work' },
        ]);
      } else {
        enq(c, [
          { k: 'set', carry: 'folder' },
          { k: 'go', to: e.to },
          { k: 'say', text: '📋 Giao ' + [T, e.text].filter(Boolean).join(': '), ms: 3000 },
          { k: 'fn', f: () => setIcon(to, '📥') },
          { k: 'wait', ms: 1300 },
          { k: 'set', carry: null },
          { k: 'go', to: 'seat' },
        ]);
      }
      break;
    case 'accept':
      enq(c, [{ k: 'go', to: 'seat' }, { k: 'set', state: 'work', icon: '' }, { k: 'say', text: '👍 Nhận ' + T + ', bắt đầu làm', ms: 2500 }]);
      break;
    case 'work':
      if (c.meeting) { // đang đứng trong phòng giám đốc: tra cứu thì đứng luôn đó, việc khác thì về bàn
        if (LIGHT_WORK.test(e.text || '')) {
          c.lastWork = now();
          if (live) setBubble(c, '📝 ' + e.text, 3500, 'ask');
          break;
        }
        leaveMeeting(c);
        c.pendingWork = e;
      } else if (c.testing) { // trưởng phòng đang ở bàn nhân sự: lệnh nào cũng là để kiểm tra bài
        c.lastWork = now();
        if (live) setBubble(c, '🧪 ' + (e.text || 'Đang kiểm tra'), 3500, 'test');
      } else if (c.cur || c.q.length || !c.atSeat) {
        if (!c.cur && !c.q.length) enq(c, [{ k: 'go', to: 'seat' }]);
        c.pendingWork = e;
      } else doWork(c, e, live);
      break;
    case 'submit': // nhân sự nộp tại bàn mình rồi giơ tay chờ trưởng phòng tới kiểm tra
      enq(c, [{ k: 'go', to: 'seat' }, { k: 'set', state: 'idle', icon: '🙋' }, { k: 'say', text: '📤 Nộp ' + T + ', chờ kiểm tra', ms: 3000 }]);
      break;
    case 'review': {
      const o = C[tasks[e.task]?.owner];
      if (!o || o === c) {
        enq(c, [{ k: 'go', to: 'seat' }, { k: 'set', state: 'work' }, { k: 'say', text: '🔍 Nghiệm thu ' + T, ms: 2500, kind: 'test' }]);
        break;
      }
      c.pendingWork = null;
      if (c.meeting) { c.meeting = false; setIcon(C.giamdoc, ''); }
      const again = c.testing?.owner === o.id;
      c.testing = { task: e.task, owner: o.id };
      c.lastWork = now();
      if (again) { if (live) setBubble(c, '🧪 ' + (e.text || 'Kiểm tra ' + T), 3500, 'test'); break; }
      enq(c, [
        { k: 'set', carry: 'clipboard' },
        { k: 'go', to: o.id },
        { k: 'set', state: 'testing', facing: 'back' },
        { k: 'fn', f: () => setIcon(o, '🔍') },
        { k: 'say', text: `🧪 Kiểm tra ${T} tại bàn ${o.p.name}`, ms: 3500, kind: 'test' },
      ]);
      break;
    }
    case 'approve':
    case 'reject': {
      if (!to) break;
      const ok = e.type === 'approve';
      c.testing = null;
      if (c.meeting) { c.meeting = false; setIcon(C.giamdoc, ''); }
      enq(c, [
        { k: 'set', carry: 'clipboard' },
        { k: 'go', to: to.id },
        { k: 'set', state: 'testing', facing: 'back' },
        { k: 'say', text: ok ? '✅ Đạt ' + T : '↩️ Trả về ' + T + (e.text ? ': ' + e.text : ''), ms: 3500, kind: 'test' },
        { k: 'fn', f: (lv) => {
          setIcon(to, ok ? '🎉' : '❗', ok ? 6000 : 0);
          if (lv) setBubble(to, ok ? '🎉 Yeah!' : '😅 Em sửa ngay', 2000);
        } },
        { k: 'wait', ms: 1600 },
        { k: 'set', carry: null, state: 'idle' },
        { k: 'go', to: 'seat' },
      ]);
      break;
    }
    case 'wait':
      enq(c, [{ k: 'set', state: c.testing ? 'testing' : c.meeting ? 'asking' : 'wait', icon: '✋' }, { k: 'say', text: e.text || 'Chờ duyệt', ms: 4000 }]);
      if (c.id !== 'giamdoc' && !c.meeting) setIcon(C.giamdoc, '📞');
      break;
    case 'idle':
      c.pendingWork = null;
      if (c.id === 'truongphong' && (c.meeting || interviewing(c))) { // hết lượt giữa buổi phỏng vấn: đứng chờ trả lời
        goAsk(c, '⏳ Chờ giám đốc trả lời…');
        break;
      }
      if (c.testing) { if (c.icon === '✋') setIcon(c, ''); break; } // hết lượt nhưng vẫn đứng ở bàn đang kiểm tra
      enq(c, [{ k: 'set', state: 'idle', icon: c.icon === '✋' ? '' : c.icon }]);
      if (c.id === 'truongphong') setIcon(C.giamdoc, '');
      break;
    case 'error':
      enq(c, [{ k: 'set', state: 'error', icon: '❗' }, { k: 'say', text: e.text, ms: 3000 }]);
      break;
  }
  if (!live) { flush(c); if (to) flush(to); }
  dirty.people = true;
}

function updateTask(e) {
  if (!e.task) return;
  const t = (tasks[e.task] ??= { id: e.task, title: '', owner: null, status: 'todo' });
  if (e.who.startsWith('agy')) t.owner = e.who;
  if (e.type === 'assign') { t.title = e.text || t.title; t.owner = e.to; t.status = 'todo'; }
  else if (e.type === 'accept' || e.type === 'work' || e.type === 'reject') t.status = 'doing';
  else if (e.type === 'submit' || e.type === 'review') t.status = 'review';
  else if (e.type === 'approve') t.status = 'done';
  dirty.tasks = true;
}

const dirty = { people: true, tasks: true, log: true, sign: true };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const nameOf = (id) => P[id]?.name || id;

function describe(e) {
  const T = e.task ? `<code>${esc(e.task)}</code> ` : '';
  switch (e.type) {
    case 'assign': return `giao ${T}cho <b>${esc(nameOf(e.to))}</b>${e.text ? ': ' + esc(e.text) : ''}`;
    case 'accept': return `nhận ${T}`;
    case 'work': return (e.who.startsWith('agy') ? 'tự làm: ' : '') + esc(e.text || 'đang làm');
    case 'submit': return `nộp ${T}, chờ kiểm tra`;
    case 'review': return `🧪 tới kiểm tra ${T}${tasks[e.task]?.owner ? `tại bàn <b>${esc(nameOf(tasks[e.task].owner))}</b>` : ''}`;
    case 'approve': return `✅ duyệt đạt ${T}của <b>${esc(nameOf(e.to))}</b>`;
    case 'reject': return `↩️ trả về ${T}${e.text ? ': ' + esc(e.text) : ''}`;
    case 'wait': return `✋ ${esc(e.text || 'đang chờ')}`;
    case 'idle': return 'rảnh tay';
    case 'error': return `❗ ${esc(e.text)}`;
    case 'interview': return `🎤 vào phòng phỏng vấn giám đốc${e.text ? ' (' + esc(e.text) + ')' : ''}`;
    case 'ask': return `❓ hỏi: ${esc(e.text)}`;
    case 'answer': return `💬 trả lời: ${esc(e.text)}`;
  }
  return esc(e.type);
}

function addLog(e) {
  const cls = ['interview', 'ask', 'answer'].includes(e.type) || (e.type === 'assign' && C.truongphong.meeting) ? 'ask'
    : e.type === 'review' || e.type === 'approve' || e.type === 'reject' || (e.who === 'truongphong' && C.truongphong.testing) ? 'test' : '';
  logItems.push({ e, html: describe(e), cls });
  if (logItems.length > 80) logItems.shift();
  dirty.log = true;
}

function statusText(c) {
  if (!c.present) return presence[c.id] ? 'Ngoại tuyến' : 'Chưa kết nối';
  if (c.id === 'truongphong' && c.meeting) return `<span class="asking">${interviewing(c) ? '🎤 Phỏng vấn giám đốc' : '💬 Đang hỏi giám đốc'}</span>`;
  if (c.id === 'giamdoc' && C.truongphong.meeting) return '<span class="asking">Đang trao đổi với Claude</span>';
  if (c.id === 'truongphong' && c.testing) return `<span class="testing">🧪 Kiểm tra ${esc(c.testing.task)} tại bàn ${esc(nameOf(c.testing.owner))}</span>`;
  if (c.icon === '🔍') return '<span class="testing">Claude đang kiểm tra bài</span>';
  if (c.walking) return 'Đang di chuyển';
  if (c.icon === '🙋') return `Đã nộp ${esc(c.task || '')}, chờ kiểm tra`;
  if (c.state === 'work') return c.id.startsWith('agy') ? `Tự làm ${esc(c.task || '')}` : 'Đang làm';
  return { idle: 'Đang rảnh', wait: 'Chờ giám đốc', error: 'Gặp lỗi', coffee: 'Đi pha cà phê', testing: 'Đang kiểm tra' }[c.state];
}

let peopleKey = '';
function renderPanel() {
  const pk = ORDER.map((id) => { const c = C[id]; return [c.state, c.walking, c.icon, c.present, c.testing?.task, c.task].join(); }).join('|') + machineText('agy2');
  if (pk !== peopleKey || dirty.people) {
    peopleKey = pk;
    dirty.people = false;
    document.getElementById('people').innerHTML = ORDER.map((id) => {
      const c = C[id];
      const machine = c.p.remote ? `<small>🖥 ${esc(machineText(id))}${presence[id]?.platform ? ' · ' + esc(presence[id].platform) : ''}</small>` : '';
      return `<div class="person"><i class="dot" style="background:${c.p.shirt}"></i><b>${c.p.name}</b><span>${c.p.role} · ${statusText(c)}</span>${machine}</div>`;
    }).join('');
  }
  if (dirty.tasks) {
    dirty.tasks = false;
    const list = Object.values(tasks);
    const open = list.filter((t) => t.status !== 'done'), done = list.filter((t) => t.status === 'done').slice(-4);
    const rows = [...open.sort((a, b) => STATUS.indexOf(a.status) - STATUS.indexOf(b.status)), ...done.reverse()];
    document.getElementById('tasks').innerHTML = rows.length ? rows.map((t) => {
      const [label, col] = STATUS_UI[t.status];
      return `<div class="task"><i class="dot" style="background:${P[t.owner]?.shirt || '#888'}"></i><code>${esc(t.id)}</code><span class="t">${esc(t.title)}</span><span class="pill" style="background:${col}">${label}</span></div>`;
    }).join('') : '<div class="empty">Chưa có task nào</div>';
  }
  if (dirty.log) {
    dirty.log = false;
    document.getElementById('log').innerHTML = logItems.slice().reverse().map(({ e, html, cls }) => {
      const time = e.ts ? new Date(e.ts).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
      return `<div class="${cls}"><time>${time}</time><b>${esc(nameOf(e.who))}</b> ${html}</div>`;
    }).join('');
  }
}

// ---------- Vòng lặp: 12 fps khi có hoạt động, 4 fps khi yên, dừng hẳn khi tab ẩn ----------
let last = 0;
function busy() {
  const n = Date.now();
  return packets.length || ORDER.some((id) => { const c = C[id]; return c.cur || c.q.length || c.state !== 'idle' || (c.bubble && c.bubble.until > n); });
}
function loop(t) {
  requestAnimationFrame(loop);
  if (t - last < 1000 / (busy() ? 12 : 4)) return;
  const dt = Math.min(t - last, 1000) / 1000; // trình duyệt có thể bóp rAF, vẫn đi đúng tốc độ
  last = t;
  updatePresence();
  for (const id of ORDER) step(C[id], dt);
  render(t);
  updateOverlay();
  renderPanel();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) for (const id of ORDER) flush(C[id]);
});

// ---------- Kết nối ----------
function setPresence(data) {
  const skew = Date.now() - data.now; // đổi giờ máy chủ sang giờ máy đang xem
  presence = {};
  for (const [id, v] of Object.entries(data.presence || {})) presence[id] = { ...v, seenAt: v.lastSeen + skew };
  dirty.sign = dirty.people = true;
  updatePresence();
}

function connect() {
  const conn = document.getElementById('conn');
  const es = new EventSource('/events' + location.search); // giữ ?token= khi xem từ máy khác
  es.onopen = () => { conn.className = 'ok'; conn.lastChild.textContent = 'Trực tiếp'; };
  es.onerror = () => { conn.className = ''; conn.lastChild.textContent = 'Mất kết nối, thử lại…'; };
  es.onmessage = (m) => {
    const data = JSON.parse(m.data);
    if (data.replay) {
      reset();
      setPresence(data);
      for (const e of data.replay) { replayNow = Date.parse(e.ts) || Date.now(); onEvent(e, false); }
      replayNow = null;
      dirty.tasks = dirty.log = dirty.people = true;
    } else if (data.presence) {
      setPresence(data);
    } else {
      onEvent(data, !document.hidden);
      if (document.hidden) for (const id of ORDER) flush(C[id]);
    }
  };
}

reset();
fit();
connect();
requestAnimationFrame(loop);
</script>
